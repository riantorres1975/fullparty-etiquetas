<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Full Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <h1 class="text-3xl md:text-4xl font-extrabold mb-6 md:mb-8 text-center md:text-left">
            🏷️ Impresión de Etiquetas <span class="text-purple-600">Full</span> <span class="text-teal-500">Party</span>
        </h1>

        <div class="bg-purple-50 p-4 rounded-xl border border-purple-200 flex flex-col md:flex-row gap-4 justify-between items-center mb-6 shadow-sm">
            
            <div class="flex flex-col md:flex-row w-full md:w-auto items-start md:items-center gap-3">
                <label class="flex items-center gap-2 font-bold text-sm cursor-pointer text-purple-900">
                    <input id="showStoreName" type="checkbox" checked class="w-5 h-5 accent-purple-600" onchange="saveConfig()">
                    Imprimir Nombre:
                </label>
                <input id="storeName" type="text" value="Full Party Uruapan" placeholder="Nombre de la tienda" oninput="saveConfig()"
                    class="border border-purple-300 p-2 rounded-lg w-full md:w-64 outline-none focus:border-purple-600 font-bold text-purple-800 transition-opacity">
            </div>
            
            <label class="flex items-center justify-center w-full md:w-auto gap-2 font-bold text-sm cursor-pointer bg-white px-4 py-2 rounded-lg shadow-sm border border-purple-200 hover:bg-gray-50 transition">
                <input id="showPrice" type="checkbox" checked class="w-5 h-5 accent-purple-600" onchange="saveConfig()">
                Imprimir con Precio
            </label>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="bg-white p-5 md:p-6 rounded-xl shadow border border-gray-200 h-fit space-y-4">
                <h2 class="font-bold text-xl text-gray-800 border-b pb-2">Crear / Editar</h2>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">SKU</label>
                    <div class="flex gap-2">
                        <input id="sku" type="text" class="border p-3 w-full rounded-lg outline-none focus:border-purple-500 bg-gray-50" placeholder="Ej. 123456">
                        <button onclick="genSku()" class="bg-gray-200 px-4 rounded-lg font-bold hover:bg-gray-300 transition text-gray-700">Auto</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre</label>
                    <input id="name" type="text" class="border p-3 w-full rounded-lg outline-none focus:border-purple-500 bg-gray-50" placeholder="Nombre del producto">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Precio</label>
                    <input id="price" type="number" class="border p-3 w-full rounded-lg outline-none focus:border-teal-500 font-bold text-teal-600 bg-gray-50" placeholder="0.00">
                </div>

                <button onclick="saveProduct()" class="bg-purple-600 text-white w-full py-4 rounded-lg font-bold shadow-md hover:bg-purple-700 transition active:scale-95 text-lg">
                    Guardar Producto
                </button>
            </div>

            <div class="lg:col-span-2 bg-white p-5 md:p-6 rounded-xl shadow border border-gray-200">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h2 class="font-bold text-xl text-gray-800 w-full md:w-auto">Inventario</h2>
                    <div class="relative w-full md:w-72">
                        <span class="absolute left-3 top-3 text-gray-400">🔍</span>
                        <input id="search" onkeyup="fetchProducts()" class="border p-3 pl-10 rounded-lg w-full outline-none focus:border-purple-500 bg-gray-50" placeholder="Buscar producto...">
                    </div>
                </div>

                <div id="mobile-list" class="block md:hidden space-y-4"></div>

                <div class="hidden md:block overflow-y-auto max-h-[500px] rounded-lg border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm relative">
                        <thead class="bg-gray-100 uppercase text-xs text-gray-500 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="p-4">SKU</th>
                                <th class="p-4">Nombre</th>
                                <th class="p-4">Precio</th>
                                <th class="p-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-100 bg-white">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
